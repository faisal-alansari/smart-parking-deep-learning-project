# Default project configuration.
seed: 42
timezone: Asia/Dubai

logging:
  level: INFO
  file: logs/smart_parking.log
  rotation: 10 MB
  retention: 5

occupancy_data:
  raw_root: data/CNN-training
  processed_dir: data/processed
  report_dir: outputs/data
  workers: 8
  # Held out completely: one CNR-EXT camera (closest view, 9 bays) and the CNRPark A/B site.
  unseen_cameras: [C02]
  unseen_site_sources: [CNRPark]
  dark_threshold: 15.0
  near_copy_max_distance: 4
  train_target_per_class: 20000
