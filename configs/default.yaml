# Default project configuration.
seed: 42
timezone: Asia/Dubai

logging:
  level: INFO
  file: logs/smart_parking.log
  rotation: 10 MB
  retention: 5

occupancy_data:
  raw_root: data/raw/cnrpark
  processed_dir: data/processed/occupancy
  report_dir: outputs/occupancy/data
  workers: 8
  # Held out completely: one CNR-EXT camera (closest view, 9 bays) and the CNRPark A/B site.
  unseen_cameras: [C02]
  unseen_site_sources: [CNRPark]
  dark_threshold: 15.0
  near_copy_max_distance: 4
  train_target_per_class: 20000

occupancy:
  dataset_csv: data/processed/occupancy/occupancy_dataset.csv
  raw_root: data/raw/cnrpark
  cache_dir: data/processed/occupancy/cache
  run_dir: experiments/occupancy
  checkpoint_dir: checkpoints/occupancy
  results_dir: outputs/occupancy
  # OccupancyCNN settings. Confirmed by the validation experiments
  # (`just occupancy-experiments`, outputs/occupancy/experiments_val.md).
  input_size: 64
  channels: [16, 32, 64, 128]
  dropout: 0.3
  augment: photo
  batch_size: 256
  epochs: 15
  lr: 0.001
  weight_decay: 0.0001
  seeds: [42, 43, 44]
  min_val_gain: 0.002
  baseline_size: 64
  hog_c_grid: [0.001, 0.003, 0.01, 0.1, 1.0]
  bootstrap_samples: 1000

plate_data:
  raw_root: data/raw/adding_uae
  processed_dir: data/processed/plates
  report_dir: outputs/plates/data
  workers: 8
  near_duplicate_max_distance: 4
