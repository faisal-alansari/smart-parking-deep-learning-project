[project]
name = "smart-parking"
version = "0.1.0"
description = "Local prototype for two-bay smart parking monitoring and visitor permits."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "gliner>=0.2.30",
    "huggingface-hub>=2.4.0",
    "joblib>=1.6",
    "loguru>=0.7.3",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "opencv-python>=5.0",
    "pandas>=2.3",
    "pillow>=12.0",
    "pydantic>=2.12",
    "pyyaml>=6.0.3",
    "regex>=2026.11",
    "scikit-image>=0.25",
    "scikit-learn>=1.7",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.40",
    "tensorboard>=2.20",
    "torch>=2.9",
    "transformers>=5.22.2",
    "ultralytics>=8.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
